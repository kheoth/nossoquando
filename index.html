<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindos | Nosso Casamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Vídeo de Fundo em Loop -->
    <div class="video-bg-container">
        <video autoplay loop muted playsinline class="video-bg">
            <!-- Substitua pelo link ou caminho do seu vídeo -->
            <source src="Nosso_Quando.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
    </div>

    <!-- Conteúdo Centralizado (Botão de Entrada) -->
    <main class="welcome-container">
        <a href="principal.html" class="enter-btn" title="Entrar no site">
            <!-- Substitua pelo link da sua imagem centralizada -->
            <img src="buton-image.png" alt="Entrar no Site" onclick="ativarTelaCheia()">
        </a>
    </main>
<script>
function ativarTelaCheia() {
  let elemento = document.documentElement; // página inteira

  if (elemento.requestFullscreen) {
    elemento.requestFullscreen();
  } else if (elemento.webkitRequestFullscreen) { // Safari
    elemento.webkitRequestFullscreen();
  } else if (elemento.msRequestFullscreen) { // IE/Edge antigo
    elemento.msRequestFullscreen();
  }
}
</script>

</body>
</html>
